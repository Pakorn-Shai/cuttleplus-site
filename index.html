<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CuttlePlus</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#071a2f,#0c3059,#12c6c2);min-height:100vh;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:900px;width:100%;background:rgba(255,255,255,.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:28px;padding:48px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.logo{display:flex;align-items:center;gap:18px;margin-bottom:28px}
.icon{width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,#22f0d0,#4d7cff);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{font-size:56px;line-height:1;font-weight:800;letter-spacing:-2px}
h1 span{color:#34f5d3}
p{font-size:20px;opacity:.92;line-height:1.7;margin-top:18px;max-width:720px}
.badges{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}
.badge{padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.12);font-size:14px}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px}
.btn{padding:14px 20px;border-radius:14px;text-decoration:none;font-weight:700}
.primary{background:#34f5d3;color:#07233a}
.secondary{background:rgba(255,255,255,.12);color:#fff}
.footer{margin-top:32px;font-size:14px;opacity:.75}
@media(max-width:700px){h1{font-size:42px}.card{padding:28px}.icon{width:64px;height:64px;font-size:32px}}
</style>
</head>
<body>
<div class="card">
<div class="logo">
<div class="icon">🐙</div>
<div>
<h1>Cuttle<span>Plus</span></h1>
</div>
</div>
<p>Ideas, Value, Solutions. A creative home for technology, automation, business ideas, data stories, and side projects built with curiosity.</p>
<div class="badges">
<div class="badge">Tech</div>
<div class="badge">Automation</div>
<div class="badge">Data & BI</div>
<div class="badge">Logistics</div>
<div class="badge">Projects</div>
<div class="badge">Insights</div>
</div>
<div class="cta">
<a href="#" class="btn primary">Launching Soon</a>
<a href="#" class="btn secondary">cuttleplus.com</a>
</div>
<div class="footer">© 2026 CuttlePlus. Building ideas with many arms.</div>
</div>
</body>
</html>
